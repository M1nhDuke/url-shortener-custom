<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL shortener</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
  form { display: grid; gap: .75rem; }
  label { display: grid; gap: .25rem; }
  input, select, button { font: inherit; padding: .4rem; }
</style>

<h1>URL shortener</h1>
<form>
  <label>Long URL
    <input name="url" type="url" required maxlength="2048" placeholder="https://example.com/a/long/path">
  </label>
  <label>Expires
    <select name="expires_in">
      <option value="">Never</option>
      <option value="3600">In 1 hour</option>
      <option value="86400">In 1 day</option>
      <option value="604800">In 7 days</option>
    </select>
  </label>
  <button>Shorten</button>
</form>
<p id="result" role="status"></p>

<script>
  const form = document.querySelector('form');
  const result = document.getElementById('result');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const { url, expires_in } = Object.fromEntries(new FormData(form));
    try {
      const res = await fetch('/api/links', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url, expires_in: expires_in ? Number(expires_in) : null }),
      });
      const data = await res.json();
      if (!res.ok) return (result.textContent = data.error);
      const link = Object.assign(document.createElement('a'), { href: data.short_url, textContent: data.short_url });
      result.replaceChildren(link, res.status === 201 ? ' (new)' : ` (already existed, ${data.clicks} clicks)`);
    } catch {
      result.textContent = 'Could not reach the server.';
    }
  });
</script>
